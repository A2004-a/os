[package]
name = "novaos-uefi-boot"
version = "0.1.0"
edition = "2021"
authors = ["NovaOS Systems Engineering <kernel@novaos.org>"]
description = "NovaOS Zero 64-Bit UEFI Boot Manager"

[dependencies]
uefi = { version = "0.28", default-features = false, features = ["alloc"] }
uefi-services = "0.25"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
