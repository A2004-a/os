[workspace]
members = [
    "boot/uefi",
    "kernel",
    "userland/runtime",
    "userland/init",
    "userland/shell",
    "userland/coreutils",
    "userland/toolkit",
    "userland/apps",
]
resolver = "2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1
