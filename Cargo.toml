[package]
name = "novaos-kernel"
version = "0.1.0"
edition = "2021"
authors = ["NovaOS Systems Engineering <kernel@novaos.org>"]
description = "NovaOS Bare-Metal x86_64 Kernel with UEFI Bootloader, 4-Level Paging, IDT, and Preemptive Scheduler"

[dependencies]
bootloader = { version = "0.9.23", features = ["map_physical_memory"] }
volatile = "0.2.6"
spin = "0.9.8"
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
x86_64 = "0.14.10"
uart_16550 = "0.2.18"
pic8259 = "0.10.2"
pc-keyboard = "0.7.0"
linked_list_allocator = "0.10.5"
conquer-once = { version = "0.3.2", default-features = false }
crossbeam-queue = { version = "0.3.8", default-features = false, features = ["alloc"] }
futures-util = { version = "0.3.28", default-features = false, features = ["alloc"] }

[package.metadata.bootimage]
test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-serial", "stdio",
    "-display", "none"
]
test-success-exit-code = 33
test-timeout = 60
run-args = [
    "-serial", "stdio",
    "-m", "512M"
]

[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false
