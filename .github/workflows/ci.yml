name: NovaOS Apex CI

on:
  push:
    branches: [ "apex", "master", "main" ]
  pull_request:
    branches: [ "apex", "master", "main" ]

jobs:
  build-and-test:
    name: Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Nightly Toolchain
        run: |
          rustup default nightly
          rustup component add rust-src llvm-tools-preview
          rustup target add x86_64-unknown-none x86_64-unknown-uefi

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Compile All Workspace Targets (make build)
        run: make build

      - name: Build UEFI Disk Image (make image)
        run: make image

      - name: Run Workspace Checks (make test)
        run: make test

      - name: Execute Headless QEMU Boot Smoke Test (make test-qemu)
        run: make test-qemu
